<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هندسة برمجيات 3 - دورة 2026 أولى</title>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* شاشة البداية */
        #start-screen {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .btn-mode {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }

        .btn-mode:hover {
            background-color: #2980b9;
        }

        /* شاشة الأسئلة */
        #quiz-screen {
            display: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .question-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .code-block {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .q-image {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .image-option-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 5px;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .image-option-label img {
            max-width: 200px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label:hover,
        .image-option-label:hover {
            background: #dfe6e9;
        }

        .option-label input,
        .image-option-label input {
            margin-left: 10px;
        }

        /* وضع الدراسة */
        body.study-mode .is-correct {
            background-color: #d4edda !important;
            border: 1px solid var(--success-color);
            color: #155724;
        }

        /* وضع الاختبار */
        #submit-test {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
        }

        #submit-test:hover {
            background-color: #27ae60;
        }

        #result-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            display: none;
        }

        .btn-restart {
            background-color: #7f8c8d;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #lightbox .close-btn:hover {
            color: #bbb;
        }

        .q-image, .image-option-label img {
            cursor: zoom-in;
        }
    </style>
</head>

            {
                id: 37,
                title: "السؤال الثالث:",
                text: "37_ إذا قام اللاعب بالتنقل حسب الاستراتيجيات في وقت اللعب، ما الديزاين باترن المناسب؟",
                options: ["State", "Adapter", "Observer", "Command"],
                correct: 0
            },
            {
                id: 38,
                title: "السؤال الثالث:",
                text: "38_ استراتيجيات دفاع هجوم، ما الديزاين باترن المناسب؟",
                options: ["State", "Strategy", "Builder", "Command"],
                correct: 1
            },
            {
                id: 39,
                title: "السؤال الثالث:",
                text: "39_ كيف بتخلي اللاعب يستخدم وضعيات مبرمجة من دون التغيير عليها؟",
                options: ["Strategy", "Adapter", "Builder", "Template Method"],
                correct: 0
            }
        ];

        let currentMode = '';

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${q.id}`;

                let html = `<div class="question-title">${q.title}</div>`;
                html += `<p>${q.text}</p>`;

                // إضافة صورة إن وجدت
                if (q.img) {
                    html += `<img src="${q.img}" class="q-image" alt="صورة السؤال" onclick="openLightbox(this.src); event.stopPropagation();">`;
                }

                // عرض الخيارات
                if (q.type === 'image_options') {
                    html += `<div class="image-options-group">`;
                    q.options.forEach((opt, optIndex) => {
                        const isCorrectClass = (currentMode === 'study' && optIndex === q.correct) ? 'is-correct' : '';
                        html += `
                            <label class="image-option-label ${isCorrectClass}" id="label-${q.id}-${optIndex}">
                                <img src="${opt}" alt="Option ${optIndex + 1}" onclick="openLightbox(this.src); event.preventDefault(); event.stopPropagation();">
                                <div><input type="radio" name="q${q.id}" value="${optIndex}"> اختيار ${optIndex + 1}</div>
                            </label>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="options-group">`;
                    q.options.forEach((opt, optIndex) => {
                        const isCorrectClass = (currentMode === 'study' && optIndex === q.correct) ? 'is-correct' : '';
                        html += `
                            <label class="option-label ${isCorrectClass}" id="label-${q.id}-${optIndex}">
                                <input type="radio" name="q${q.id}" value="${optIndex}"> ${opt}
                            </label>
                        `;
                    });
                    html += `</div>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function startApp(mode) {
            currentMode = mode;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';

            renderQuestions();

            if (mode === 'study') {
                document.body.classList.add('study-mode');
                document.getElementById('mode-title').innerHTML = '<i class="fas fa-book-open"></i> وضع الدراسة (الإجابات الصحيحة مظللة بالأخضر)';

                // تعطيل الأزرار واختيار الإجابة الصحيحة
                questions.forEach(q => {
                    const radios = document.querySelectorAll(`input[name="q${q.id}"]`);
                    radios.forEach(radio => radio.disabled = true);
                    const correctRadio = document.querySelector(`input[name="q${q.id}"][value="${q.correct}"]`);
                    if (correctRadio) correctRadio.checked = true;
                });
            } else if (mode === 'test') {
                document.body.classList.add('test-mode');
                document.getElementById('mode-title').innerHTML = '<i class="fas fa-edit"></i> وضع الاختبار';
                document.getElementById('submit-test').style.display = 'block';
            }
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        function calculateScore() {
            let score = 0;
            let total = questions.length;

            questions.forEach(q => {
                let selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                let correctLabelId = `label-${q.id}-${q.correct}`;
                let correctLabel = document.getElementById(correctLabelId);

                // إظهار الجواب الصحيح دائماً بالأخضر
                if (correctLabel) correctLabel.style.backgroundColor = '#d4edda';

                if (selected) {
                    let selectedValue = parseInt(selected.value);
                    if (selectedValue === q.correct) {
                        score++;
                    } else {
                        // تلوين الجواب الخاطئ بالأحمر
                        let selectedLabelId = `label-${q.id}-${selectedValue}`;
                        document.getElementById(selectedLabelId).style.backgroundColor = '#f8d7da';
                    }
                }
            });

            let resultDiv = document.getElementById('result-display');
            resultDiv.style.display = 'block';

            let percentage = Math.round((score / total) * 100);
            resultDiv.innerHTML = `نتيجتك هي: ${score} من ${total} (${percentage}%)`;

            document.getElementById('submit-test').style.display = 'none';

            // تعطيل تغيير الإجابات بعد التسليم
            let allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(r => r.disabled = true);

            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
